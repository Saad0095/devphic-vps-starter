name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Node.js Test Suite (${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  validate-scripts-and-docker:
    name: Lint & Configuration Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup sample environment
        run: cp .env.example .env

      - name: Syntax check Bash scripts
        run: |
          for script in scripts/*.sh; do
            echo "Checking $script syntax..."
            bash -n "$script"
          done

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "Docker compose syntax is valid."

      - name: Validate Dockerfile Build
        run: |
          docker build --dry-run . || docker build -t devphic-app:ci .
          echo "Docker build completed successfully."
